services:
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        ports:
            - "3002:3002"
        environment:
            - NEXT_PUBLIC_API_ENDPOINT=https://${HOST_IP:-localhost}:8002/scan
        volumes:
            - ./certs:/app/certs:ro
        command: >
            npm run dev --
            --hostname 0.0.0.0
            --port 3002
            --experimental-https
            --experimental-https-key /app/certs/key.pem
            --experimental-https-cert /app/certs/cert.pem
        depends_on:
            - backend

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        ports:
            - "8002:8002"
        environment:
            - HOST_IP=${HOST_IP:-localhost}
            - SCAN_TOKEN=${SCAN_TOKEN:?Run scripts/start.sh or set SCAN_TOKEN}
        volumes:
            - ./certs:/app/certs:ro
        command: >
            uvicorn main:app
            --host 0.0.0.0
            --port 8002
            --ssl-keyfile /app/certs/key.pem
            --ssl-certfile /app/certs/cert.pem
